<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Mundo Singular • Formação de Palavras</title><link rel="stylesheet" href="style.css?v=20260827-22"><style>.wrap{max-width:920px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 12px 36px #17345d16}.scene{min-height:220px;border-radius:28px;background:#eef8fc url('assets/leo-estrelinha-3d.webp?v=20260827-22') center/contain no-repeat;margin:18px 0}.progress{height:11px;background:#e8eff3;border-radius:999px;overflow:hidden;margin:14px 0 22px}.progress span{display:block;height:100%;background:#25a7a4}.object{font-size:68px;margin:8px}.slots{display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.slot{min-width:110px;padding:18px;border:3px dashed #b9d3dd;border-radius:20px;font-size:34px;font-weight:900;color:#17345d;background:#f7fbfc}.plus{font-size:30px;font-weight:900;color:#25a7a4}.word{font-size:48px;font-weight:900;letter-spacing:5px;color:#7b55d9;min-height:62px}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.choices button{background:#fff;border:3px solid #dfe9ee;border-radius:22px;padding:20px;font-size:30px;font-weight:900;color:#17345d;cursor:pointer}.feedback{min-height:34px;font-size:20px;font-weight:900;color:#7b55d9}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.card{padding:20px 14px}.scene{min-height:170px}.choices{grid-template-columns:1fr}.word{font-size:38px}.slot{min-width:90px;font-size:28px}}</style></head><body><header><div class="brand brand-official"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260827-22" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="inicio.html?v=20260827-22">Início</a><a class="secondary linkbtn" href="alfabetizacao-completa.html?v=20260827-22">Alfabetização</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main class="wrap"><section class="card"><p id="tag" class="tag">TRILHA 3 • FORMAÇÃO DE PALAVRAS</p><div class="progress"><span id="bar"></span></div><h1 id="title">Vamos juntar as sílabas</h1><div class="scene" role="img" aria-label="Léo e Estrelinha 3D"></div><div id="object" class="object">⚽</div><p id="instruction">Toque nas sílabas na ordem certa.</p><div id="slots" class="slots"></div><div id="word" class="word"></div><button class="speak-top" onclick="hear()">🔊 Ouvir</button><div id="choices" class="choices"></div><p id="feedback" class="feedback"></p><div class="nav"><button class="secondary" onclick="prev()">← Anterior</button><button class="primary" onclick="resetLesson()">Fazer novamente</button><button id="next" class="secondary" onclick="next()">Próxima →</button></div></section></main><footer>Mundo Singular • Versão de teste • Formação de Palavras</footer><script>const lessons=[{word:'BOLA',parts:['BO','LA'],icon:'⚽'},{word:'CASA',parts:['CA','SA'],icon:'🏠'},{word:'DADO',parts:['DA','DO'],icon:'🎲'},{word:'PATO',parts:['PA','TO'],icon:'🦆'},{word:'MALA',parts:['MA','LA'],icon:'🧳'},{word:'SAPO',parts:['SA','PO'],icon:'🐸'},{word:'GATO',parts:['GA','TO'],icon:'🐱'},{word:'FOCA',parts:['FO','CA'],icon:'🦭'},{word:'LATA',parts:['LA','TA'],icon:'🥫'},{word:'VACA',parts:['VA','CA'],icon:'🐄'},{word:'PIPA',parts:['PI','PA'],icon:'🪁'},{word:'LOBO',parts:['LO','BO'],icon:'🐺'}];let i=0,step=0,helped=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');const $=id=>document.getElementById(id);function render(){const a=lessons[i];step=0;helped=false;saved=false;$('tag').textContent=`TRILHA 3 • PALAVRA ${i+1} DE ${lessons.length}`;$('title').textContent='Vamos formar '+a.word;$('object').textContent=a.icon;$('word').textContent='';$('feedback').textContent='';$('bar').style.width=`${((i+1)/lessons.length)*100}%`;$('slots').innerHTML=a.parts.map(()=>'<div class="slot">?</div>').join('<span class="plus">+</span>');renderChoices();$('next').textContent=i===lessons.length-1?'Concluir ✓':'Próxima →';setTimeout(hear,220)}function renderChoices(){const a=lessons[i];if(step>=a.parts.length){finishWord();return}const correct=a.parts[step],wrong=wrongPart(correct);const opts=Math.random()>.5?[correct,wrong]:[wrong,correct];$('instruction').textContent=`Escolha a ${step+1}ª sílaba de ${a.word}.`;$('choices').innerHTML=opts.map(x=>`<button onclick="choose('${x}')">${x}</button>`).join('')}function wrongPart(correct){const pool=['BA','CA','DA','FA','GA','LA','MA','PA','SA','TA','BO','DO','FO','LO','PO','TO','NA','VA'];return pool.find(x=>x!==correct&&!lessons[i].parts.includes(x))||'ME'}function choose(value){const a=lessons[i],correct=a.parts[step];if(value===correct){const slots=document.querySelectorAll('.slot');slots[step].textContent=correct;step++;$('feedback').textContent='Muito bem!';speak(correct);setTimeout(renderChoices,350)}else{helped=true;$('feedback').textContent=`A Estrelinha ajuda: procure ${correct}.`;speak(`Procure a sílaba ${correct}.`)}}function finishWord(){const a=lessons[i];$('word').textContent=a.word;$('instruction').textContent=`${a.parts.join(' mais ')} forma ${a.word}.`;$('choices').innerHTML='';$('feedback').textContent=`Conseguimos! ${a.word}!`;if(!saved){save();saved=true}speak(`${a.parts.join(' com ')}. ${a.word}. Muito bem!`)}function hear(){const a=lessons[i];speak(`Vamos formar ${a.word}. Toque nas sílabas na ordem certa.`)}function speak(t){if(settings.quiet||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.76:settings.support==='B'?.88:1;speechSynthesis.speak(u)}function save(){const a=lessons[i],key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity:`Formação de Palavra — ${a.word}`,supportLevel:settings.support||'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-80)))}function next(){if(i<lessons.length-1){i++;render()}else{$('feedback').textContent='Parabéns! Você concluiu a primeira etapa de formação de palavras.';speak('Parabéns! Você concluiu a primeira etapa de formação de palavras.')}}function prev(){if(i>0){i--;render()}}function resetLesson(){render()}render();</script></body></html>
