<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Mundo Singular • Alfabetização Completa</title><link rel="stylesheet" href="style.css?v=20260828-12"><style>.wrap{max-width:980px;margin:18px auto;padding:0 14px}.top-card,.lesson{background:#fff;border-radius:30px;padding:26px;box-shadow:0 12px 36px #17345d16}.top-card{text-align:center}.stage-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}.stage-grid button{border:0;border-radius:24px;padding:22px;font-size:20px;font-weight:900;cursor:pointer}.stage-grid button:first-child{background:#e8f8f6;color:#157f7c}.stage-grid button:last-child{background:#f2edff;color:#6e4bc4}.scene{min-height:210px;border-radius:26px;background:#eef8fc url('assets/leo-estrelinha-3d.webp?v=20260828-12') center/contain no-repeat;margin:18px 0}.big{font-size:96px;font-weight:900;color:#17345d;letter-spacing:4px}.formula{font-size:26px;font-weight:900;color:#25a7a4}.options{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.options button{background:#fff;border:3px solid #e2e9ee;border-radius:22px;padding:16px;cursor:pointer;min-height:190px}.visual{display:flex;align-items:center;justify-content:center;min-height:125px;gap:6px}.visual img{width:100%;max-width:220px;height:125px;object-fit:contain}.visual.multi img{width:90px;max-width:28%;height:105px}.fallback3d{width:120px;height:120px;border-radius:26px;background:linear-gradient(145deg,#eef8fc,#fff);box-shadow:0 8px 20px #17345d18;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#17345d}.options b{display:block;font-size:18px;color:#17345d;margin-top:7px}.feedback{min-height:34px;font-size:20px;font-weight:900;color:#7b55d9}.nav{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.progress{height:10px;background:#e8eff3;border-radius:999px;overflow:hidden;margin:14px 0}.progress span{display:block;height:100%;background:#25a7a4;width:0}.family-tabs{display:flex;gap:8px;overflow:auto;padding:8px 0 4px}.family-tabs button{white-space:nowrap;border:2px solid #dce8ee;background:#fff;border-radius:999px;padding:9px 14px;font-weight:800;cursor:pointer}.family-tabs button.on{background:#17345d;color:white;border-color:#17345d}.note{font-size:14px;color:#617181}.hidden{display:none!important}@media(max-width:700px){.stage-grid{grid-template-columns:1fr}.top-card,.lesson{padding:18px 14px}.scene{min-height:165px}.big{font-size:70px}.options{grid-template-columns:1fr}.options button{min-height:170px}.visual img{height:115px}.visual.multi img{height:90px}}</style></head><body><header><div class="brand"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260828-12" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="inicio.html?v=20260828-12">Início</a><a class="secondary linkbtn" href="index.html?v=20260828-12">Comunicação</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main class="wrap"><section id="home" class="top-card"><p class="tag">TRILHA 2 • ALFABETIZAÇÃO COMPLETA</p><h1>Alfabeto e famílias silábicas</h1><p>Aprender com Léo e Estrelinha, no próprio ritmo.</p><div class="scene"></div><div class="stage-grid"><button onclick="startAlphabet()">🔤 Alfabeto A–Z<br><small>26 letras</small></button><button onclick="startSyllables()">🧩 Sílabas<br><small>famílias silábicas essenciais</small></button></div><p class="note">Imagens 3D claras e correspondentes às palavras.</p></section><section id="lesson" class="lesson hidden"><p id="tag" class="tag"></p><div id="familyTabs" class="family-tabs hidden"></div><div class="progress"><span id="bar"></span></div><h1 id="title"></h1><div id="big" class="big"></div><div id="formula" class="formula"></div><p id="instruction"></p><button class="speak-top" onclick="hear()">🔊 Ouvir</button><div id="options" class="options"></div><p id="feedback" class="feedback"></p><div class="nav"><button class="secondary" onclick="prev()">← Anterior</button><button class="primary" onclick="render()">Fazer novamente</button><button id="next" class="secondary" onclick="next()">Próxima →</button><button class="secondary" onclick="goHome()">Início</button></div></section></main><footer>Mundo Singular • Versão de teste • Alfabetização completa</footer><script>const CDN='https://cdn.jsdelivr.net/gh/shuding/fluentui-emoji-unicode/assets/';const alphabet=[['A','Abacaxi'],['B','Bola'],['C','Casa'],['D','Dado'],['E','Elefante'],['F','Foca'],['G','Gato'],['H','Hotel'],['I','Igreja'],['J','Janela'],['K','Kiwi'],['L','Lua'],['M','Mala'],['N','Navio'],['O','Ovo'],['P','Pato'],['Q','Queijo'],['R','Rato'],['S','Sapo'],['T','Tigre'],['U','Uva'],['V','Vaca'],['W','Web'],['X','Xícara'],['Y','Yoga'],['Z','Zebra']];const families=[{c:'B',s:['BA','BE','BI','BO','BU'],w:['Bala','Bebê','Bicicleta','Bola','Bule']},{c:'C',s:['CA','CE','CI','CO','CU'],w:['Casa','Cebola','Cidade','Copo','Cubo']},{c:'D',s:['DA','DE','DI','DO','DU'],w:['Dado','Dedo','Dinheiro','Doce','Ducha']},{c:'F',s:['FA','FE','FI','FO','FU'],w:['Fada','Feijão','Fita','Foca','Fubá']},{c:'G',s:['GA','GE','GI','GO','GU'],w:['Gato','Gelo','Girafa','Gota','Gude']},{c:'J',s:['JA','JE','JI','JO','JU'],w:['Jaca','Jegue','Jipe','Jogo','Judô']},{c:'L',s:['LA','LE','LI','LO','LU'],w:['Lata','Leite','Livro','Lobo','Lua']},{c:'M',s:['MA','ME','MI','MO','MU'],w:['Mala','Mesa','Milho','Mola','Muro']},{c:'N',s:['NA','NE','NI','NO','NU'],w:['Navio','Neve','Ninho','Nota','Nuvem']},{c:'P',s:['PA','PE','PI','PO','PU'],w:['Pato','Pera','Pipa','Pote','Pulo']},{c:'Q',s:['QUA','QUE','QUI'],w:['Quadro','Queijo','Quilo']},{c:'R',s:['RA','RE','RI','RO','RU'],w:['Rato','Rede','Rio','Roda','Rua']},{c:'S',s:['SA','SE','SI','SO','SU'],w:['Sapo','Selo','Sino','Sopa','Suco']},{c:'T',s:['TA','TE','TI','TO','TU'],w:['Taça','Tela','Tigre','Tomate','Tulipa']},{c:'V',s:['VA','VE','VI','VO','VU'],w:['Vaca','Vela','Violão','Vovó','Vulcão']},{c:'X',s:['XA','XE','XI','XO','XU'],w:['Xadrez','Xerife','Xícara','Xote','Xuxu']},{c:'Z',s:['ZA','ZE','ZI','ZO','ZU'],w:['Zangão','Zero','Zíper','Zoológico','Zumbi']}];const glyphs={'Abacaxi':'🍍','Bola':'⚽','Casa':'🏠','Dado':'🎲','Elefante':'🐘','Foca':'🦭','Gato':'🐱','Hotel':'🏨','Igreja':'⛪','Janela':'🪟','Kiwi':'🥝','Lua':'🌙','Mala':'🧳','Navio':'🚢','Ovo':'🥚','Pato':'🦆','Queijo':'🧀','Rato':'🐭','Sapo':'🐸','Tigre':'🐯','Uva':'🍇','Vaca':'🐄','Web':'🌐','Xícara':'☕','Yoga':'🧘','Zebra':'🦓','Bala':'🍬','Bebê':'👶','Bicicleta':'🚲','Bule':'🫖','Cebola':'🧅','Cidade':'🏙️','Copo':'🥤','Cubo':'🧊','Dedo':'☝️','Dinheiro':'💵','Doce':'🍬','Ducha':'🚿','Fada':'🧚','Feijão':'🫘','Fita':'🎀','Fubá':'🌽','Gelo':'🧊','Girafa':'🦒','Gota':'💧','Gude':'🔵','Jaca':'🍈','Jegue':'🫏','Jipe':'🚙','Jogo':'🎮','Judô':'🥋','Lata':'🥫','Leite':'🥛','Livro':'📚','Lobo':'🐺','Mesa':'🪑','Milho':'🌽','Mola':'🌀','Muro':'🧱','Neve':'❄️','Ninho':'🪺','Nota':'🎵','Nuvem':'☁️','Pera':'🍐','Pipa':'🪁','Pote':'🏺','Pulo':'⬆️','Quadro':'🖼️','Quilo':'⚖️','Rede':'🥅','Rio':'🏞️','Roda':'🛞','Rua':'🛣️','Selo':'✉️','Sino':'🔔','Sopa':'🍲','Suco':'🧃','Taça':'🏆','Tela':'🖥️','Tomate':'🍅','Tulipa':'🌷','Vela':'🕯️','Violão':'🎻','Vovó':'👵','Vulcão':'🌋','Xadrez':'♟️','Xerife':'⭐','Xote':'🎵','Xuxu':'🥬','Zangão':'🐝','Zero':'0️⃣','Zíper':'🤐','Zoológico':['🦁','🐘','🦒'],'Zumbi':'🧟'};const specialVisual={'Xadrez':'https://em-content.zobj.net/source/microsoft-teams/363/chess-pawn_265f-fe0f.png','Zíper':'https://em-content.zobj.net/source/microsoft-teams/363/zipper-mouth-face_1f910.png'};let mode='alphabet',idx=0,fam=0,helped=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');const $=id=>document.getElementById(id);function srcFor(g){return CDN+encodeURIComponent(g)+'_3d.png'}function preloadWords(words){words.forEach(w=>{if(specialVisual[w]){const im=new Image();im.src=specialVisual[w];return}const gs=Array.isArray(glyphs[w])?glyphs[w]:[glyphs[w]];gs.filter(Boolean).forEach(g=>{const im=new Image();im.src=srcFor(g)})})}function preloadFamily(n){const f=families[n];if(!f)return;preloadWords(f.w);const d=families[(n+3)%families.length];if(d)preloadWords(d.w)}function imageFail(img,word){const box=img.closest('.visual');if(!box)return;box.innerHTML='<span class="fallback3d">'+(word||'?').charAt(0)+'</span>'}function visual(word){if(specialVisual[word])return `<span class="visual"><img src="${specialVisual[word]}" alt="${word}" data-word="${word}"></span>`;const gs=Array.isArray(glyphs[word])?glyphs[word]:[glyphs[word]||'⭐'];return `<span class="visual ${gs.length>1?'multi':''}">${gs.map(g=>`<img src="${srcFor(g)}" alt="${word}" data-word="${word}">`).join('')}</span>`}function bindImageErrors(){document.querySelectorAll('.visual img').forEach(img=>img.addEventListener('error',()=>imageFail(img,img.dataset.word)))}function startAlphabet(){mode='alphabet';idx=0;showLesson();preloadWords(alphabet.map(x=>x[1]));render()}function startSyllables(){mode='syllables';fam=0;idx=0;showLesson();preloadFamily(0);preloadFamily(1);render()}function showLesson(){$('home').classList.add('hidden');$('lesson').classList.remove('hidden')}function goHome(){if('speechSynthesis'in window)speechSynthesis.cancel();$('lesson').classList.add('hidden');$('home').classList.remove('hidden')}function render(){helped=false;saved=false;$('feedback').textContent='';if(mode==='alphabet')renderAlphabet();else renderSyllable()}function renderAlphabet(){const [l,w]=alphabet[idx],d=alphabet[(idx+5)%alphabet.length];$('familyTabs').classList.add('hidden');$('tag').textContent=`ALFABETO • LETRA ${idx+1} DE ${alphabet.length}`;$('title').textContent=`Vamos conhecer a letra ${l}`;$('big').textContent=l;$('formula').textContent=`${l} de ${w}`;$('instruction').textContent=`Toque na palavra que começa com a letra ${l}.`;$('options').innerHTML=`<button onclick="answer(true)">${visual(w)}<b>${w}</b></button><button onclick="answer(false)">${visual(d[1])}<b>${d[1]}</b></button>`;bindImageErrors();$('bar').style.width=`${((idx+1)/alphabet.length)*100}%`;$('next').textContent=idx===alphabet.length-1?'Concluir alfabeto ✓':'Próxima →';setTimeout(hear,180)}function renderSyllable(){const f=families[fam],s=f.s[idx],w=f.w[idx],d=families[(fam+3)%families.length],dw=d.w[Math.min(idx,d.w.length-1)];preloadFamily(fam);preloadFamily(fam+1);$('familyTabs').classList.remove('hidden');$('familyTabs').innerHTML=families.map((x,n)=>`<button class="${n===fam?'on':''}" onclick="pickFamily(${n})">${x.c}</button>`).join('');$('tag').textContent=`SÍLABAS • FAMÍLIA DO ${f.c} • ${idx+1} DE ${f.s.length}`;$('title').textContent=`Vamos aprender ${s}`;$('big').textContent=s;$('formula').textContent=f.c==='Q'?`${f.c} + U + ${s.slice(-1)} = ${s}`:`${f.c} + ${s.slice(-1)} = ${s}`;$('instruction').textContent=`Toque na palavra que começa com ${s}.`;$('options').innerHTML=`<button onclick="answer(true)">${visual(w)}<b>${w}</b></button><button onclick="answer(false)">${visual(dw)}<b>${dw}</b></button>`;bindImageErrors();const before=families.slice(0,fam).reduce((a,x)=>a+x.s.length,0),total=families.reduce((a,x)=>a+x.s.length,0);$('bar').style.width=`${((before+idx+1)/total)*100}%`;$('next').textContent=(fam===families.length-1&&idx===f.s.length-1)?'Concluir sílabas ✓':'Próxima →';setTimeout(hear,180)}function hear(){if(mode==='alphabet'){const [l,w]=alphabet[idx];speak(`Esta é a letra ${l}. ${l} de ${w}. Toque na palavra que começa com ${l}.`)}else{const f=families[fam],s=f.s[idx],w=f.w[idx],ending=s.slice(-1);const formation=f.c==='Q'?`${f.c}. U. ${ending}. ${s}.`:`${f.c}. ${ending}. ${s}.`;speak(`${formation} ${s} de ${w}. Toque na palavra que começa com ${s}.`)}}function answer(ok){let label;if(mode==='alphabet')label=alphabet[idx][1];else label=families[fam].w[idx];if(ok){$('feedback').textContent=`Muito bem! ${label}!`;if(!saved){save();saved=true}speak(`Muito bem! ${label}.`)}else{helped=true;$('feedback').textContent=`A Estrelinha ajuda: procure ${mode==='alphabet'?alphabet[idx][0]:families[fam].s[idx]} de ${label}.`;speak(`Procure ${label}.`)}}function speak(t){if(settings.quiet||!('speechSynthesis'in window)||!('SpeechSynthesisUtterance'in window))return;const synth=window.speechSynthesis;synth.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.76:settings.support==='B'?.88:1;u.pitch=1;u.volume=1;const voices=synth.getVoices();const ptVoice=voices.find(v=>String(v.lang).toLowerCase()==='pt-br')||voices.find(v=>String(v.lang).toLowerCase().startsWith('pt'));if(ptVoice)u.voice=ptVoice;synth.resume();synth.speak(u)}function save(){const activity=mode==='alphabet'?`Alfabeto — ${alphabet[idx][0]} de ${alphabet[idx][1]}`:`Sílabas — ${families[fam].s[idx]} de ${families[fam].w[idx]}`,key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity,supportLevel:settings.support||'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-200)))}function next(){if(mode==='alphabet'){if(idx<alphabet.length-1){idx++;render()}else{$('feedback').textContent='Parabéns! Você concluiu o alfabeto.';speak('Parabéns! Você concluiu o alfabeto.')}}else{const f=families[fam];if(idx<f.s.length-1){idx++;render()}else if(fam<families.length-1){fam++;idx=0;preloadFamily(fam);render()}else{$('feedback').textContent='Parabéns! Você concluiu as famílias silábicas.';speak('Parabéns! Você concluiu as famílias silábicas.')}}}function prev(){if(mode==='alphabet'){if(idx>0){idx--;render()}}else{if(idx>0){idx--;render()}else if(fam>0){fam--;idx=families[fam].s.length-1;render()}}}function pickFamily(n){fam=n;idx=0;preloadFamily(n);render()}preloadWords(alphabet.map(x=>x[1]).slice(0,8));</script></body></html>
