<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mundo Singular • Alfabetização</title><link rel="stylesheet" href="style.css?v=20260827-13"><style>.alpha-card{max-width:880px;margin:14px auto;background:#fff;border-radius:30px;padding:32px;text-align:center;box-shadow:0 12px 36px #17345d16}.alpha-scene{min-height:250px;border-radius:28px;background:#eaf8f7 url('assets/leo-estrelinha-3d.webp') center/contain no-repeat;margin:22px 0}.letter{font-size:110px;font-weight:900;color:#17345d}.alpha-options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.alpha-options button{background:#fff;border:3px solid #e2e9ee;border-radius:24px;padding:22px;font-size:44px;cursor:pointer}.alpha-options b{display:block;font-size:18px;color:#17345d;margin-top:8px}.alpha-feedback{font-size:20px;font-weight:800;min-height:34px;color:#7b55d9}.trail-nav{display:flex;justify-content:center;gap:10px;margin:18px}.trail-nav a{text-decoration:none}@media(max-width:700px){.alpha-card{padding:20px 14px}.alpha-scene{min-height:180px}.letter{font-size:82px}}</style></head><body><header><div class="brand"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="index.html">Comunicação</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main><section class="alpha-card"><p class="tag">TRILHA 2 • ALFABETIZAÇÃO • ATIVIDADE 01</p><h1>Vamos conhecer a letra A</h1><div class="alpha-scene" role="img" aria-label="Léo e Estrelinha 3D"></div><p>A Estrelinha mostra uma letra para o Léo.</p><div class="letter">A</div><p id="alphaInstruction">Toque na figura que começa com a letra A.</p><button class="speak-top" onclick="speakAlpha()">🔊 Ouvir</button><div class="alpha-options"><button onclick="answerAlpha(true)">🍍<b>Abacaxi</b></button><button onclick="answerAlpha(false)">⚽<b>Bola</b></button></div><p id="alphaFeedback" class="alpha-feedback"></p><div class="trail-nav"><button class="primary" onclick="resetAlpha()">Fazer novamente</button></div></section></main><footer>Mundo Singular • Versão de teste • Trilha de Alfabetização</footer><script>let helped=false;function speakAlpha(){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance('Esta é a letra A. A de Abacaxi. Toque na figura que começa com a letra A.');u.lang='pt-BR';u.rate=.82;speechSynthesis.speak(u)}function answerAlpha(ok){const f=document.getElementById('alphaFeedback');if(ok){f.textContent='Muito bem! A de Abacaxi!';saveAlpha();speakText('Muito bem! A de Abacaxi!')}else{helped=true;f.textContent='A Estrelinha ajuda: procure a figura que começa com A.';speakText('Procure a figura que começa com A.')} }function speakText(t){if(!('speechSynthesis'in window))return;const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.82;speechSynthesis.speak(u)}function saveAlpha(){const key='mundoSingularDemo';const data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:'Criança A',activity:'Alfabetização 01 — Letra A',supportLevel:'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-30)))}function resetAlpha(){helped=false;document.getElementById('alphaFeedback').textContent='';}setTimeout(speakAlpha,500);</script></body></html>
