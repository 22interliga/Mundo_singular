<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mundo Singular • Alfabetização</title><link rel="stylesheet" href="style.css?v=20260827-14"><style>.alpha-card{max-width:880px;margin:14px auto;background:#fff;border-radius:30px;padding:32px;text-align:center;box-shadow:0 12px 36px #17345d16}.alpha-scene{min-height:240px;border-radius:28px;background:#eaf8f7 url('assets/leo-estrelinha-3d.webp?v=20260827-14') center/contain no-repeat;margin:22px 0}.letter{font-size:110px;font-weight:900;color:#17345d}.alpha-options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.alpha-options button{background:#fff;border:3px solid #e2e9ee;border-radius:24px;padding:22px;font-size:44px;cursor:pointer}.alpha-options b{display:block;font-size:18px;color:#17345d;margin-top:8px}.alpha-feedback{font-size:20px;font-weight:800;min-height:34px;color:#7b55d9}.trail-nav{display:flex;justify-content:center;gap:10px;margin:18px;flex-wrap:wrap}.progress-dots{display:flex;justify-content:center;gap:8px;margin:14px}.progress-dots span{width:12px;height:12px;border-radius:50%;background:#d6e4ed}.progress-dots .on{background:#25a7a4}@media(max-width:700px){.alpha-card{padding:20px 14px}.alpha-scene{min-height:180px}.letter{font-size:82px}.alpha-options button{font-size:38px}}</style></head><body><header><div class="brand"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260827-14" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="index.html">Comunicação</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main><section class="alpha-card"><p id="alphaTag" class="tag">TRILHA 2 • ALFABETIZAÇÃO</p><div id="dots" class="progress-dots"></div><h1 id="alphaTitle">Vamos conhecer a letra A</h1><div class="alpha-scene" role="img" aria-label="Léo e Estrelinha 3D"></div><p>A Estrelinha mostra uma letra para o Léo.</p><div id="letter" class="letter">A</div><p id="alphaInstruction"></p><button class="speak-top" onclick="speakAlpha()">🔊 Ouvir</button><div id="alphaOptions" class="alpha-options"></div><p id="alphaFeedback" class="alpha-feedback"></p><div class="trail-nav"><button class="secondary" onclick="prevAlpha()">← Anterior</button><button class="primary" onclick="resetAlpha()">Fazer novamente</button><button id="nextAlpha" class="secondary" onclick="nextAlpha()">Próxima →</button></div></section></main><footer>Mundo Singular • Versão de teste • Trilha de Alfabetização</footer><script>const lessons=[{l:'A',word:'Abacaxi',icon:'🍍',wrong:'⚽',wrongWord:'Bola'},{l:'E',word:'Elefante',icon:'🐘',wrong:'🍎',wrongWord:'Maçã'},{l:'I',word:'Igreja',icon:'⛪',wrong:'⚽',wrongWord:'Bola'},{l:'O',word:'Ovo',icon:'🥚',wrong:'🍌',wrongWord:'Banana'},{l:'U',word:'Uva',icon:'🍇',wrong:'🚗',wrongWord:'Carro'}];let idx=0,helped=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');function render(){const a=lessons[idx];helped=false;saved=false;document.getElementById('alphaTag').textContent=`TRILHA 2 • ALFABETIZAÇÃO • ATIVIDADE ${String(idx+1).padStart(2,'0')}`;document.getElementById('alphaTitle').textContent=`Vamos conhecer a letra ${a.l}`;document.getElementById('letter').textContent=a.l;document.getElementById('alphaInstruction').textContent=`Toque na figura que começa com a letra ${a.l}.`;document.getElementById('alphaOptions').innerHTML=`<button onclick="answerAlpha(true)">${a.icon}<b>${a.word}</b></button><button onclick="answerAlpha(false)">${a.wrong}<b>${a.wrongWord}</b></button>`;document.getElementById('alphaFeedback').textContent='';document.getElementById('dots').innerHTML=lessons.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('');document.getElementById('nextAlpha').textContent=idx===lessons.length-1?'Concluir ✓':'Próxima →';setTimeout(speakAlpha,250)}function speakAlpha(){const a=lessons[idx];speakText(`Esta é a letra ${a.l}. ${a.l} de ${a.word}. Toque na figura que começa com a letra ${a.l}.`)}function answerAlpha(ok){const a=lessons[idx],f=document.getElementById('alphaFeedback');if(ok){f.textContent=`Muito bem! ${a.l} de ${a.word}!`;if(!saved){saveAlpha();saved=true}speakText(`Muito bem! ${a.l} de ${a.word}!`)}else{helped=true;f.textContent=`A Estrelinha ajuda: procure a figura que começa com ${a.l}.`;speakText(`Procure a figura que começa com ${a.l}.`)}}function speakText(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.78:settings.support==='B'?.9:1;speechSynthesis.speak(u)}function saveAlpha(){const a=lessons[idx],key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity:`Alfabetização ${String(idx+1).padStart(2,'0')} — Letra ${a.l}`,supportLevel:settings.support||'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-30)))}function resetAlpha(){render()}function nextAlpha(){if(idx<lessons.length-1){idx++;render()}else{document.getElementById('alphaFeedback').textContent='Parabéns! Você concluiu as vogais A, E, I, O e U.';speakText('Parabéns! Você concluiu as vogais A, E, I, O e U.')}}function prevAlpha(){if(idx>0){idx--;render()}}render();</script></body></html>
