<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mundo Singular • Sílabas D</title><link rel="stylesheet" href="style.css?v=20260827-17"><style>.sy-card{max-width:880px;margin:14px auto;background:#fff;border-radius:30px;padding:32px;text-align:center;box-shadow:0 12px 36px #17345d16}.sy-scene{min-height:220px;border-radius:28px;background:#eef8fc url('assets/leo-estrelinha-3d.webp?v=20260827-17') center/contain no-repeat;margin:18px 0}.syllable{font-size:100px;font-weight:900;color:#17345d;letter-spacing:5px}.split{font-size:28px;font-weight:800;color:#25a7a4;margin:0 0 14px}.sy-options{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.sy-options button{background:#fff;border:3px solid #e2e9ee;border-radius:24px;padding:22px;font-size:42px;cursor:pointer}.sy-options b{display:block;font-size:18px;color:#17345d;margin-top:8px}.feedback{font-size:20px;font-weight:800;min-height:34px;color:#7b55d9}.nav{display:flex;justify-content:center;gap:10px;margin:18px;flex-wrap:wrap}.dots{display:flex;justify-content:center;gap:8px;margin:14px}.dots span{width:12px;height:12px;border-radius:50%;background:#d6e4ed}.dots .on{background:#25a7a4}@media(max-width:700px){.sy-card{padding:20px 14px}.sy-scene{min-height:170px}.syllable{font-size:76px}.sy-options button{font-size:36px}}</style></head><body><header><div class="brand"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260827-17" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="silabas-c.html">Sílabas C</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main><section class="sy-card"><p id="tag" class="tag">TRILHA 2 • ALFABETIZAÇÃO • SÍLABAS D</p><div id="dots" class="dots"></div><h1 id="title">Vamos formar sílabas</h1><div class="sy-scene" role="img" aria-label="Léo e Estrelinha 3D"></div><div id="syllable" class="syllable">DA</div><div id="split" class="split">D + A = DA</div><p id="instruction"></p><button class="speak-top" onclick="hear()">🔊 Ouvir</button><div id="options" class="sy-options"></div><p id="feedback" class="feedback"></p><div class="nav"><button class="secondary" onclick="prev()">← Anterior</button><button class="primary" onclick="repeatLesson()">Fazer novamente</button><button id="next" class="secondary" onclick="next()">Próxima →</button></div></section></main><footer>Mundo Singular • Versão de teste • Alfabetização</footer><script>const lessons=[{s:'DA',v:'A',word:'Dado',icon:'🎲',wrong:'⚽',wrongWord:'Bola'},{s:'DE',v:'E',word:'Dedo',icon:'☝️',wrong:'🍇',wrongWord:'Uva'},{s:'DI',v:'I',word:'Dinheiro',icon:'💵',wrong:'🥚',wrongWord:'Ovo'},{s:'DO',v:'O',word:'Dominó',icon:'🁫',wrong:'🍍',wrongWord:'Abacaxi'},{s:'DU',v:'U',word:'Ducha',icon:'🚿',wrong:'🚗',wrongWord:'Carro'}];let i=0,help=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');function render(){const a=lessons[i];help=false;saved=false;document.getElementById('tag').textContent=`TRILHA 2 • ALFABETIZAÇÃO • SÍLABA ${String(i+11).padStart(2,'0')}`;document.getElementById('title').textContent=`Vamos aprender ${a.s}`;document.getElementById('syllable').textContent=a.s;document.getElementById('split').textContent=`D + ${a.v} = ${a.s}`;document.getElementById('instruction').textContent=`Toque na figura que começa com ${a.s}.`;document.getElementById('options').innerHTML=`<button onclick="answer(true)">${a.icon}<b>${a.word}</b></button><button onclick="answer(false)">${a.wrong}<b>${a.wrongWord}</b></button>`;document.getElementById('feedback').textContent='';document.getElementById('dots').innerHTML=lessons.map((_,n)=>`<span class="${n===i?'on':''}"></span>`).join('');document.getElementById('next').textContent=i===lessons.length-1?'Concluir ✓':'Próxima →';setTimeout(hear,250)}function hear(){const a=lessons[i];speak(`D com ${a.v}, ${a.s}. ${a.s} de ${a.word}. Toque na figura que começa com ${a.s}.`)}function answer(ok){const a=lessons[i],f=document.getElementById('feedback');if(ok){f.textContent=`Muito bem! ${a.s} de ${a.word}!`;if(!saved){save();saved=true}speak(`Muito bem! ${a.s} de ${a.word}!`)}else{help=true;f.textContent=`A Estrelinha ajuda: procure ${a.s} de ${a.word}.`;speak(`Procure ${a.s} de ${a.word}.`)}}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.76:settings.support==='B'?.88:1;speechSynthesis.speak(u)}function save(){const a=lessons[i],key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity:`Alfabetização — Sílaba ${a.s}`,supportLevel:settings.support||'A',independent:help?0:1,supported:help?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-30)))}function next(){if(i<lessons.length-1){i++;render()}else{document.getElementById('feedback').textContent='Parabéns! Você concluiu DA, DE, DI, DO e DU.';speak('Parabéns! Você concluiu DA, DE, DI, DO e DU.')}}function prev(){if(i>0){i--;render()}}function repeatLesson(){render()}render();</script></body></html>
