<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Mundo Singular • Frases Simples</title><link rel="stylesheet" href="style.css?v=20260828-10"><style>.wrap{max-width:940px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 12px 36px #17345d16}.scene{min-height:220px;border-radius:28px;background:#eef8fc url('assets/leo-estrelinha-3d.webp?v=20260828-10') center/contain no-repeat;margin:18px 0}.progress{height:11px;background:#e8eff3;border-radius:999px;overflow:hidden;margin:14px 0 22px}.progress span{display:block;height:100%;background:#25a7a4}.sentence{font-size:38px;font-weight:900;line-height:1.35;color:#17345d;margin:18px 0}.blank{display:inline-block;min-width:130px;border-bottom:4px solid #7b55d9;color:#7b55d9}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.choices button{background:#fff;border:3px solid #dfe9ee;border-radius:22px;padding:16px;font-size:23px;font-weight:900;color:#17345d;cursor:pointer;min-height:190px}.visual3d{height:125px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}.visual3d img{width:100%;height:125px;object-fit:contain;border-radius:18px}.fallback{width:110px;height:110px;border-radius:24px;background:#eef8fc;display:flex;align-items:center;justify-content:center;font-size:52px;font-weight:900;color:#17345d}.feedback{min-height:34px;font-size:20px;font-weight:900;color:#7b55d9}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.context{font-size:18px;color:#617181;line-height:1.5}@media(max-width:700px){.card{padding:20px 14px}.scene{min-height:170px}.choices{grid-template-columns:1fr}.sentence{font-size:30px}.choices button{min-height:170px}}</style></head><body><header><div class="brand brand-official"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260828-10" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="inicio.html?v=20260828-10">Início</a><a class="secondary linkbtn" href="palavras.html?v=20260828-10">Palavras</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main class="wrap"><section class="card"><p id="tag" class="tag">TRILHA 4 • FRASES SIMPLES</p><div class="progress"><span id="bar"></span></div><h1 id="title">Vamos completar a frase</h1><div class="scene" role="img" aria-label="Léo e Estrelinha 3D"></div><p id="context" class="context"></p><div id="sentence" class="sentence"></div><button class="speak-top" onclick="hear()">🔊 Ouvir</button><div id="choices" class="choices"></div><p id="feedback" class="feedback"></p><div class="nav"><button class="secondary" onclick="prev()">← Anterior</button><button class="primary" onclick="resetLesson()">Fazer novamente</button><button id="next" class="secondary" onclick="next()">Próxima →</button></div></section></main><footer>Mundo Singular • Versão de teste • Frases Simples</footer><script>const lessons=[{context:'Léo está com sede.',before:'Léo quer',answer:'água',url:'https://em-content.zobj.net/source/microsoft-teams/363/droplet_1f4a7.png',wrong:'bola',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/soccer-ball_26bd.png'},{context:'Léo está com fome.',before:'Léo quer',answer:'comer',url:'https://em-content.zobj.net/source/microsoft-teams/363/fork-and-knife-with-plate_1f37d-fe0f.png',wrong:'livro',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/books_1f4da.png'},{context:'Léo vai brincar.',before:'Léo pega a',answer:'bola',url:'https://em-content.zobj.net/source/microsoft-teams/363/soccer-ball_26bd.png',wrong:'água',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/droplet_1f4a7.png'},{context:'A casa tem uma entrada.',before:'A',answer:'porta',url:'https://em-content.zobj.net/source/microsoft-teams/363/door_1f6aa.png',wrong:'lua',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/crescent-moon_1f319.png'},{context:'Léo está lendo.',before:'Léo lê um',answer:'livro',url:'https://em-content.zobj.net/source/microsoft-teams/363/books_1f4da.png',wrong:'pato',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/duck_1f986.png'},{context:'O animal faz miau.',before:'O',answer:'gato',url:'https://em-content.zobj.net/source/microsoft-teams/363/cat-face_1f431.png',wrong:'sapo',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/frog_1f438.png'},{context:'O animal vive na lagoa.',before:'O',answer:'sapo',url:'https://em-content.zobj.net/source/microsoft-teams/363/frog_1f438.png',wrong:'gato',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/cat-face_1f431.png'},{context:'Está de noite no céu.',before:'A',answer:'lua',url:'https://em-content.zobj.net/source/microsoft-teams/363/crescent-moon_1f319.png',wrong:'bola',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/soccer-ball_26bd.png'},{context:'Léo precisa de apoio.',before:'Léo pede',answer:'ajuda',url:'https://em-content.zobj.net/source/microsoft-teams/363/person-raising-hand_1f64b.png',wrong:'pipa',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/kite_1fa81.png'},{context:'Léo escolheu beber.',before:'Léo toma',answer:'suco',url:'https://em-content.zobj.net/source/microsoft-teams/363/beverage-box_1f9c3.png',wrong:'dado',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/game-die_1f3b2.png'},{context:'O pato está andando.',before:'O',answer:'pato',url:'https://em-content.zobj.net/source/microsoft-teams/363/duck_1f986.png',wrong:'copo',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/cup-with-straw_1f964.png'},{context:'Léo está feliz com a atividade.',before:'Léo diz',answer:'sim',url:'https://em-content.zobj.net/source/microsoft-teams/363/check-mark-button_2705.png',wrong:'não',wrongUrl:'https://em-content.zobj.net/source/microsoft-teams/363/cross-mark_274c.png'}];let i=0,helped=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');const $=id=>document.getElementById(id);function imageError(img,label){const box=img.parentElement;box.innerHTML='';const f=document.createElement('div');f.className='fallback';f.textContent=(label||'?').charAt(0).toUpperCase();box.appendChild(f)}function img3d(url,label){return '<div class="visual3d"><img src="'+url+'" alt="'+label+'" loading="eager" data-label="'+label+'"></div>'}function preload(){lessons.forEach(a=>[a.url,a.wrongUrl].forEach(u=>{const im=new Image();im.src=u}))}function render(){const a=lessons[i];helped=false;saved=false;$('tag').textContent=`TRILHA 4 • FRASE ${i+1} DE ${lessons.length}`;$('title').textContent='Vamos completar a frase';$('context').textContent=a.context;$('sentence').innerHTML=`${a.before} <span class="blank">_____</span>.`;$('feedback').textContent='';$('bar').style.width=`${((i+1)/lessons.length)*100}%`;const opts=Math.random()>.5?[[a.answer,a.url,true],[a.wrong,a.wrongUrl,false]]:[[a.wrong,a.wrongUrl,false],[a.answer,a.url,true]];$('choices').innerHTML=opts.map(o=>`<button onclick="answer(${o[2]})">${img3d(o[1],o[0])}${o[0]}</button>`).join('');document.querySelectorAll('.visual3d img').forEach(img=>img.addEventListener('error',()=>imageError(img,img.dataset.label)));$('next').textContent=i===lessons.length-1?'Concluir ✓':'Próxima →';setTimeout(hear,220)}function answer(ok){const a=lessons[i];if(ok){$('sentence').innerHTML=`${a.before} <span class="blank">${a.answer}</span>.`;$('feedback').textContent='Muito bem! Frase completa.';if(!saved){save();saved=true}speak(`${a.before} ${a.answer}. Muito bem!`)}else{helped=true;$('feedback').textContent=`A Estrelinha ajuda: escolha ${a.answer}.`;speak(`Procure ${a.answer}.`)}}function hear(){const a=lessons[i];speak(`${a.context} Complete a frase: ${a.before}.`)}function speak(t){if(settings.quiet||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.76:settings.support==='B'?.88:1;speechSynthesis.speak(u)}function save(){const a=lessons[i],key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity:`Frase Simples — ${a.before} ${a.answer}`,supportLevel:settings.support||'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-100)))}function next(){if(i<lessons.length-1){i++;render()}else{$('feedback').textContent='Parabéns! Você concluiu a primeira etapa de frases simples.';speak('Parabéns! Você concluiu a primeira etapa de frases simples.')}}function prev(){if(i>0){i--;render()}}function resetLesson(){render()}preload();render();</script></body></html>
