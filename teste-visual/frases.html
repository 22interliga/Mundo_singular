<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Mundo Singular • Frases Simples</title><link rel="stylesheet" href="style.css?v=20260827-23"><style>.wrap{max-width:940px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 12px 36px #17345d16}.scene{min-height:220px;border-radius:28px;background:#eef8fc url('assets/leo-estrelinha-3d.webp?v=20260827-23') center/contain no-repeat;margin:18px 0}.progress{height:11px;background:#e8eff3;border-radius:999px;overflow:hidden;margin:14px 0 22px}.progress span{display:block;height:100%;background:#25a7a4}.sentence{font-size:38px;font-weight:900;line-height:1.35;color:#17345d;margin:18px 0}.blank{display:inline-block;min-width:130px;border-bottom:4px solid #7b55d9;color:#7b55d9}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.choices button{background:#fff;border:3px solid #dfe9ee;border-radius:22px;padding:20px;font-size:26px;font-weight:900;color:#17345d;cursor:pointer}.choices span{font-size:38px;display:block;margin-bottom:7px}.feedback{min-height:34px;font-size:20px;font-weight:900;color:#7b55d9}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}.context{font-size:18px;color:#617181;line-height:1.5}@media(max-width:700px){.card{padding:20px 14px}.scene{min-height:170px}.choices{grid-template-columns:1fr}.sentence{font-size:30px}}</style></head><body><header><div class="brand brand-official"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260827-23" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="inicio.html?v=20260827-23">Início</a><a class="secondary linkbtn" href="palavras.html?v=20260827-23">Palavras</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main class="wrap"><section class="card"><p id="tag" class="tag">TRILHA 4 • FRASES SIMPLES</p><div class="progress"><span id="bar"></span></div><h1 id="title">Vamos completar a frase</h1><div class="scene" role="img" aria-label="Léo e Estrelinha 3D"></div><p id="context" class="context"></p><div id="sentence" class="sentence"></div><button class="speak-top" onclick="hear()">🔊 Ouvir</button><div id="choices" class="choices"></div><p id="feedback" class="feedback"></p><div class="nav"><button class="secondary" onclick="prev()">← Anterior</button><button class="primary" onclick="resetLesson()">Fazer novamente</button><button id="next" class="secondary" onclick="next()">Próxima →</button></div></section></main><footer>Mundo Singular • Versão de teste • Frases Simples</footer><script>const lessons=[{context:'Léo está com sede.',before:'Léo quer',answer:'água',icon:'💧',wrong:'bola',wrongIcon:'⚽'},{context:'Léo está com fome.',before:'Léo quer',answer:'comer',icon:'🍽️',wrong:'livro',wrongIcon:'📚'},{context:'Léo vai brincar.',before:'Léo pega a',answer:'bola',icon:'⚽',wrong:'água',wrongIcon:'💧'},{context:'A casa tem uma entrada.',before:'A',answer:'porta',icon:'🚪',wrong:'lua',wrongIcon:'🌙'},{context:'Léo está lendo.',before:'Léo lê um',answer:'livro',icon:'📚',wrong:'pato',wrongIcon:'🦆'},{context:'O animal faz miau.',before:'O',answer:'gato',icon:'🐱',wrong:'sapo',wrongIcon:'🐸'},{context:'O animal vive na lagoa.',before:'O',answer:'sapo',icon:'🐸',wrong:'gato',wrongIcon:'🐱'},{context:'Está de noite no céu.',before:'A',answer:'lua',icon:'🌙',wrong:'bola',wrongIcon:'⚽'},{context:'Léo precisa de apoio.',before:'Léo pede',answer:'ajuda',icon:'🙋',wrong:'pipa',wrongIcon:'🪁'},{context:'Léo escolheu beber.',before:'Léo toma',answer:'suco',icon:'🧃',wrong:'dado',wrongIcon:'🎲'},{context:'O pato está andando.',before:'O',answer:'pato',icon:'🦆',wrong:'copo',wrongIcon:'🥤'},{context:'Léo está feliz com a atividade.',before:'Léo diz',answer:'sim',icon:'✅',wrong:'não',wrongIcon:'❌'}];let i=0,helped=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');const $=id=>document.getElementById(id);function render(){const a=lessons[i];helped=false;saved=false;$('tag').textContent=`TRILHA 4 • FRASE ${i+1} DE ${lessons.length}`;$('title').textContent='Vamos completar a frase';$('context').textContent=a.context;$('sentence').innerHTML=`${a.before} <span class="blank">_____</span>.`;$('feedback').textContent='';$('bar').style.width=`${((i+1)/lessons.length)*100}%`;const opts=Math.random()>.5?[[a.answer,a.icon,true],[a.wrong,a.wrongIcon,false]]:[[a.wrong,a.wrongIcon,false],[a.answer,a.icon,true]];$('choices').innerHTML=opts.map(o=>`<button onclick="answer(${o[2]})"><span>${o[1]}</span>${o[0]}</button>`).join('');$('next').textContent=i===lessons.length-1?'Concluir ✓':'Próxima →';setTimeout(hear,220)}function answer(ok){const a=lessons[i];if(ok){$('sentence').innerHTML=`${a.before} <span class="blank">${a.answer}</span>.`;$('feedback').textContent='Muito bem! Frase completa.';if(!saved){save();saved=true}speak(`${a.before} ${a.answer}. Muito bem!`)}else{helped=true;$('feedback').textContent=`A Estrelinha ajuda: escolha ${a.answer}.`;speak(`Procure ${a.answer}.`)}}function hear(){const a=lessons[i];speak(`${a.context} Complete a frase: ${a.before}.`)}function speak(t){if(settings.quiet||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.76:settings.support==='B'?.88:1;speechSynthesis.speak(u)}function save(){const a=lessons[i],key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity:`Frase Simples — ${a.before} ${a.answer}`,supportLevel:settings.support||'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-100)))}function next(){if(i<lessons.length-1){i++;render()}else{$('feedback').textContent='Parabéns! Você concluiu a primeira etapa de frases simples.';speak('Parabéns! Você concluiu a primeira etapa de frases simples.')}}function prev(){if(i>0){i--;render()}}function resetLesson(){render()}render();</script></body></html>
