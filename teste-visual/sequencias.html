<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>Mundo Singular • Compreensão e Sequências</title><link rel="stylesheet" href="style.css?v=20260828-11"><style>.wrap{max-width:940px;margin:18px auto;padding:0 14px}.card{background:#fff;border-radius:30px;padding:28px;text-align:center;box-shadow:0 12px 36px #17345d16}.scene{min-height:190px;border-radius:28px;background:#eef8fc url('assets/leo-estrelinha-3d.webp?v=20260828-11') center/contain no-repeat;margin:16px 0}.progress{height:11px;background:#e8eff3;border-radius:999px;overflow:hidden;margin:12px 0 20px}.progress span{display:block;height:100%;background:#25a7a4}.story{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:18px 0}.event{min-width:190px;background:#f7fbfc;border:3px solid #dfecef;border-radius:22px;padding:14px}.event b{display:block;font-size:16px;color:#17345d;margin-top:7px}.arrow{font-size:28px;color:#25a7a4;font-weight:900}.question{font-size:24px;font-weight:900;color:#17345d}.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:18px}.choices button{background:#fff;border:3px solid #dfe9ee;border-radius:22px;padding:14px;cursor:pointer;min-height:185px}.choices b{display:block;font-size:17px;color:#17345d;margin-top:6px}.visual3d{height:125px;display:flex;align-items:center;justify-content:center}.visual3d img{width:100%;height:125px;object-fit:contain}.unknown{height:125px;display:flex;align-items:center;justify-content:center;font-size:64px;font-weight:900;color:#7b55d9}.fallback{width:110px;height:110px;border-radius:24px;background:#eef8fc;display:flex;align-items:center;justify-content:center;font-size:44px;font-weight:900;color:#17345d}.feedback{min-height:36px;font-size:20px;font-weight:900;color:#7b55d9}.nav{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:18px}@media(max-width:700px){.card{padding:20px 14px}.scene{min-height:150px}.choices{grid-template-columns:1fr}.event{min-width:145px}.visual3d,.visual3d img,.unknown{height:110px}}</style></head><body><header><div class="brand brand-official"><div class="brand-characters"><img src="assets/leo-estrelinha-3d.webp?v=20260828-11" alt="Léo e Estrelinha 3D"></div><b>Mundo Singular</b></div><div class="header-actions"><a class="secondary linkbtn" href="inicio.html?v=20260828-11">Início</a><a class="secondary linkbtn" href="frases.html?v=20260828-10">Frases</a><a class="secondary linkbtn" href="educador.html">Painel do Educador</a></div></header><main class="wrap"><section class="card"><p id="tag" class="tag">TRILHA 5 • COMPREENSÃO E SEQUÊNCIAS</p><div class="progress"><span id="bar"></span></div><h1>O que acontece depois?</h1><div class="scene" role="img" aria-label="Léo e Estrelinha 3D"></div><div id="story" class="story"></div><p id="question" class="question"></p><button class="speak-top" onclick="hear()">🔊 Ouvir</button><div id="choices" class="choices"></div><p id="feedback" class="feedback"></p><div class="nav"><button class="secondary" onclick="prev()">← Anterior</button><button class="primary" onclick="render()">Fazer novamente</button><button id="next" class="secondary" onclick="next()">Próxima →</button></div></section></main><footer>Mundo Singular • Versão de teste • Compreensão e Sequências</footer><script>const B='https://em-content.zobj.net/source/microsoft-teams/363/';const lessons=[{events:[['bed_1f6cf.png','Léo acorda'],['toothbrush_1faa5.png','Escova os dentes']],q:'O que Léo faz depois de acordar?',ok:['toothbrush_1faa5.png','Escova os dentes'],bad:['soccer-ball_26bd.png','Joga bola']},{events:[['soap_1f9fc.png','Lava as mãos'],['fork-and-knife-with-plate_1f37d-fe0f.png','Vai comer']],q:'O que acontece depois de lavar as mãos?',ok:['fork-and-knife-with-plate_1f37d-fe0f.png','Vai comer'],bad:['bed_1f6cf.png','Vai dormir']},{events:[['cup-with-straw_1f964.png','Pega o copo'],['droplet_1f4a7.png','Bebe água']],q:'O que Léo faz depois de pegar o copo?',ok:['droplet_1f4a7.png','Bebe água'],bad:['running-shoe_1f45f.png','Calça o sapato']},{events:[['backpack_1f392.png','Pega a mochila'],['school_1f3eb.png','Vai para a escola']],q:'Para onde Léo vai com a mochila?',ok:['school_1f3eb.png','Para a escola'],bad:['bathtub_1f6c1.png','Para o banho']},{events:[['open-book_1f4d6.png','Abre o livro'],['books_1f4da.png','Começa a ler']],q:'O que vem depois de abrir o livro?',ok:['books_1f4da.png','Começa a ler'],bad:['fork-and-knife_1f374.png','Começa a comer']},{events:[['banana_1f34c.png','Descasca a banana'],['banana_1f34c.png','Come a banana']],q:'O que acontece depois de descascar a banana?',ok:['banana_1f34c.png','Come a banana'],bad:['broom_1f9f9.png','Varre a casa']},{events:[['teddy-bear_1f9f8.png','Brinca'],['package_1f4e6.png','Guarda o brinquedo']],q:'O que Léo faz quando termina de brincar?',ok:['package_1f4e6.png','Guarda o brinquedo'],bad:['cooking_1f373.png','Faz comida']},{events:[['shower_1f6bf.png','Toma banho'],['t-shirt_1f455.png','Coloca a roupa']],q:'O que vem depois do banho?',ok:['t-shirt_1f455.png','Coloca a roupa'],bad:['soccer-ball_26bd.png','Joga bola']},{events:[['fork-and-knife-with-plate_1f37d-fe0f.png','Termina de comer'],['toothbrush_1faa5.png','Escova os dentes']],q:'O que pode acontecer depois da refeição?',ok:['toothbrush_1faa5.png','Escova os dentes'],bad:['backpack_1f392.png','Pega a mochila']},{events:[['crescent-moon_1f319.png','Anoitece'],['bed_1f6cf.png','Vai dormir']],q:'O que Léo faz quando chega a hora de dormir?',ok:['bed_1f6cf.png','Vai para a cama'],bad:['school_1f3eb.png','Vai para a escola']}];let i=0,helped=false,saved=false;const settings=JSON.parse(localStorage.getItem('mundoSingularSettings')||'{"profile":"Criança A","support":"A"}');const $=id=>document.getElementById(id);function src(file){return B+file}function pre(){lessons.forEach(a=>[a.events[0],a.events[1],a.ok,a.bad].forEach(x=>{const im=new Image();im.src=src(x[0])}))}function pic(x){return `<div class="visual3d"><img src="${src(x[0])}" alt="${x[1]}" data-label="${x[1]}"></div>`}function bind(){document.querySelectorAll('.visual3d img').forEach(img=>img.addEventListener('error',()=>{const p=img.parentElement;p.innerHTML=`<div class="fallback">${(img.dataset.label||'?').charAt(0)}</div>`}))}function render(){const a=lessons[i];helped=false;saved=false;$('tag').textContent=`TRILHA 5 • SEQUÊNCIA ${i+1} DE ${lessons.length}`;$('bar').style.width=`${((i+1)/lessons.length)*100}%`;$('story').innerHTML=`<div class="event">${pic(a.events[0])}<b>${a.events[0][1]}</b></div><span class="arrow">→</span><div class="event"><div class="unknown">?</div><b>O que vem depois?</b></div>`;$('question').textContent=a.q;$('feedback').textContent='';const opts=Math.random()>.5?[a.ok,a.bad]:[a.bad,a.ok];$('choices').innerHTML=opts.map(x=>`<button data-value="${x[1]}">${pic(x)}<b>${x[1]}</b></button>`).join('');document.querySelectorAll('#choices button').forEach(btn=>btn.addEventListener('click',()=>answer(btn.dataset.value)));bind();$('next').textContent=i===lessons.length-1?'Concluir ✓':'Próxima →';setTimeout(hear,180)}function answer(v){const a=lessons[i];if(v===a.ok[1]){$('story').innerHTML=`<div class="event">${pic(a.events[0])}<b>${a.events[0][1]}</b></div><span class="arrow">→</span><div class="event">${pic(a.events[1])}<b>${a.events[1][1]}</b></div>`;bind();$('feedback').textContent='Muito bem! Você encontrou o que acontece depois.';if(!saved){save();saved=true}speak(`Muito bem. ${a.events[0][1]}. Depois, ${a.events[1][1]}.`)}else{helped=true;$('feedback').textContent=`A Estrelinha ajuda: pense no que acontece depois de “${a.events[0][1]}”.`;speak(`Vamos pensar. O que acontece depois de ${a.events[0][1]}?`)}}function hear(){const a=lessons[i];speak(`${a.events[0][1]}. ${a.q}`)}function speak(t){if(settings.quiet||!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=settings.support==='A'?.76:settings.support==='B'?.88:1;speechSynthesis.speak(u)}function save(){const key='mundoSingularDemo',data=JSON.parse(localStorage.getItem(key)||'[]');data.push({profile:settings.profile||'Criança A',activity:`Compreensão — Sequência ${i+1}`,supportLevel:settings.support||'A',independent:helped?0:1,supported:helped?1:0,date:new Date().toLocaleString('pt-BR')});localStorage.setItem(key,JSON.stringify(data.slice(-100)))}function next(){if(i<lessons.length-1){i++;render()}else{$('feedback').textContent='Parabéns! Você concluiu a primeira etapa de compreensão e sequências.';speak('Parabéns! Você concluiu a primeira etapa de compreensão e sequências.')}}function prev(){if(i>0){i--;render()}}pre();render();</script></body></html>
